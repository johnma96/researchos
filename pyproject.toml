[project]
name = "researchos"
version = "0.1.0"
description = "Open-source research engine: monitors scientific sources, answers questions, and sends personalized briefings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "John Mario Montoya Zapata", email = "jmmontoyaz13@gmail.com" },
]
keywords = ["rag", "llm", "agents", "research", "arxiv", "pubmed"]

dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "pyprojroot>=0.3.0",
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux'",
    "pysqlite3-binary>=0.5.4.post2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["researchos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require APIs or DB)",
]
addopts = "--cov=src/researchos --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
